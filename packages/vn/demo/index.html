<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@kitsune/vn — hybrid demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* The WebGL canvas: 3D game + VN sprite passes. */
      #vn-canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      /* DOM dialogue box + choices, stacked above the canvas. */
      #stage {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="vn-canvas"></canvas>
    <div id="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
